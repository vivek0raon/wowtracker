<!DOCTYPE html>
<html>
<head>
  <title>DSA Auto-Sync</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 16px; width: 320px; margin: 0; }
    h3 { margin-top: 0; margin-bottom: 12px; font-size: 16px; }
    .data-row { margin-bottom: 8px; font-size: 13px; }
    .label { font-weight: 600; color: #555; display: block; margin-bottom: 2px; }
    .value { color: #111; word-break: break-all; background: #f5f5f5; padding: 6px; border-radius: 4px; max-height: 100px; overflow-y: auto; }
    button { 
      width: 100%; padding: 10px; background: #2eaadc; color: white; border: none; 
      border-radius: 4px; cursor: pointer; font-weight: 600; margin-top: 12px; 
    }
    button:hover { background: #2490bd; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status { margin-top: 8px; font-size: 12px; text-align: center; }
    .success { color: #4dab69; }
    .error { color: #e16259; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h3>DSA Auto-Sync</h3>
  
  <div id="content-container" class="hidden">
    <div class="data-row">
      <span class="label">Problem</span>
      <div class="value" id="p-title">...</div>
    </div>
    <div class="data-row">
      <span class="label">Tags</span>
      <div class="value" id="p-tags">...</div>
    </div>
    <div class="data-row">
      <span class="label">Solution Code Found?</span>
      <div class="value" id="p-code">No</div>
    </div>
    
    <button id="sync-btn">Sync & Generate Summary</button>
  </div>
  
  <div id="error-container">
    <p style="font-size: 13px; color: #666;">Please open a LeetCode or GeeksForGeeks problem page.</p>
  </div>
  
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
